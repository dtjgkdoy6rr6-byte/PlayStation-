<!DOCTYPE html>
<html lang="id">

<head>

/* =========================================
   SEARCH
========================================= */

.search-box {
    margin-bottom: 18px;
}

.search-box input {
    width: 100%;
}


/* =========================================
   TABLE
========================================= */

.table-wrap {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 850px;
    border-collapse: collapse;
}

th,
td {
    padding: 13px 10px;

    border-bottom:
        1px solid #29313d;

    text-align: left;

    font-size: 13px;
}

th {
    color: #9ca3af;
    font-weight: normal;
}

td {
    color: #e5e7eb;
}


/* =========================================
   GAME COVER
========================================= */

.game-image {
    width: 55px;
    height: 65px;

    object-fit: cover;

    border-radius: 7px;

    background: #0f141b;
}


/* =========================================
   ACTION BUTTON
========================================= */

.action-buttons {
    display: flex;
    gap: 7px;
}

.edit-btn,
.delete-btn {
    border: none;

    padding: 8px 10px;

    border-radius: 7px;

    cursor: pointer;

    color: white;

    font-size: 12px;
}

.edit-btn {
    background: #2563eb;
}

.delete-btn {
    background: #dc2626;
}

.edit-btn:active,
.delete-btn:active,
.add-btn:active,
.save-btn:active,
.cancel-btn:active {
    transform: scale(.97);
}


/* =========================================
   BADGE
========================================= */

.badge {
    display: inline-block;

    padding: 5px 8px;

    border-radius: 6px;

    font-size: 11px;
}

.badge-green {
    background: #12351f;
    color: #86efac;
}

.badge-gray {
    background: #29313d;
    color: #d1d5db;
}


/* =========================================
   LOADING
========================================= */

.loading {
    text-align: center;

    padding: 30px;

    color: #9ca3af;

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================
   KONFIGURASI SUPABASE
========================================= */

const SUPABASE_URL =
    "https://jxoeuxcwsaqmgsxiopqj.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_1FUkGM29tdLwvbnMn6AgIw_eesBsUrw";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


console.log(
    "PLAYVAULT: Supabase berhasil dibuat."
);


/* =========================================
   ELEMENT
========================================= */

const gameTable =
    document.getElementById("gameTable");

const totalGames =
    document.getElementById("totalGames");

const popularGames =
    document.getElementById("popularGames");

const legalGames =
    document.getElementById("legalGames");

const searchInput =
    document.getElementById("searchInput");


/* =========================================
   DATA GAME
========================================= */

let allGames = [];


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================
   LOAD GAME
========================================= */

async function loadGames() {

    console.log(
        "PLAYVAULT: Mengambil data game..."
    );


    if (!gameTable) {

        console.error(
            "PLAYVAULT: #gameTable tidak ditemukan."
        );

        return;

    }


    gameTable.innerHTML = `
        <tr>
            <td
                colspan="8"
                class="loading"
            >
                Memuat data game...
            </td>
        </tr>
    `;


    const {
        data,
        error
    } = await supabaseClient
        .from("games")
        .select("*")
        .order("id", {
            ascending: false
        });


    if (error) {

        console.error(
            "PLAYVAULT: Gagal mengambil game:",
            error
        );


        gameTable.innerHTML = `
            <tr>
                <td
                    colspan="8"
                    class="loading"
                >
                    Gagal mengambil data game.
                    <br><br>
                    ${escapeHtml(
                        error.message
                    )}
                </td>
            </tr>
        `;

        return;

    }


    allGames = data || [];


    console.log(
        "PLAYVAULT: Jumlah game:",
        allGames.length
    );


    updateStatistics();

    renderGames(allGames);

}


/* =========================================
   STATISTIK
========================================= */

function updateStatistics() {

    if (totalGames) {

        totalGames.textContent =
            allGames.length;

    }


    if (popularGames) {

        popularGames.textContent =
            allGames.filter(
                function(game) {

                    return game.popular === true;

                }
            ).length;

    }


    if (legalGames) {

        legalGames.textContent =
            allGames.filter(
                function(game) {

                    return game.legal === true;

                }
            ).length;

    }

}


/* =========================================
   RENDER GAME
========================================= */

function renderGames(games) {

    if (!gameTable) {
        return;
    }


    if (!games || games.length === 0) {

        gameTable.innerHTML = `
            <tr>
                <td
                    colspan="8"
                    class="loading"
                >
                    Tidak ada game ditemukan.
                </td>
            </tr>
        `;

        return;

    }
    gameTable.innerHTML =
        games.map(
            function(game) {

                const image =
                    game.image ||
                    "https://placehold.co/55x65?text=Game";


                const status =
                    game.popular
                        ? `
                            <span
                                class="badge badge-green"
                            >
                                Populer
                            </span>
                        `
                        : `
                            <span
                                class="badge badge-gray"
                            >
                                Normal
                            </span>
                        `;


                return `

                    <tr>

                        <td>

                            <img
                                src="${escapeHtml(image)}"
                                class="game-image"
                                alt="${escapeHtml(
                                    game.title || "Game"
                                )}"
                                onerror="
                                    this.src='https://placehold.co/55x65?text=Game'
                                
                                "
                            >

                        </td>


                        <td>

                            <strong>
                                ${escapeHtml(
                                    game.title || "-"
                                )}
                            </strong>

                        </td>


                        <td>
                            ${escapeHtml(
                                game.platform || "-"
                            )}
                        </td>


                        <td>
                            ${escapeHtml(
                                game.genre || "-"
                                </td>


                        <td>
                            ${game.rating ?? "-"}
                        </td>


                        <td>
                            ${status}
                        </td>


                        <td>

                            <div
                                class="action-buttons"
                            >

                                <button
                                    type="button"
                                    class="edit-btn"
                                    disabled
                                >
                                    Edit
                                </button>


                                <button
                                    type="button"
                            )}
                        </td>


                        <td>
                            ${game.year ?? "-"}
                            </td>


                        <td>
                            ${game.rating ?? "-"}
                        </td>


                        <td>
                            ${status}
                        </td>


                        <td>

                            <div
                                class="action-buttons"
                            >

                                <button
                                    type="button"
                                    class="edit-btn"
                                    disabled
                                >
                                    Edit
                                </button>


                                <button
                                    type="button"
                                    class="delete-btn"
                                    disabled
                                >
                                    Hapus
                                </button>
                                </div>

                        </td>

                    </tr>

                `;

            }
        ).join("");

}


/* =========================================
   SEARCH
========================================= */

if (searchInput) {

    searchInput.addEventListener(
        "input",
        function() {

            const keyword =
                this.value
                    .trim()
                    .toLowerCase();
            if (!keyword) {

                renderGames(
                    allGames
                );

                return;

            }


            const filtered =
                allGames.filter(
                    function(game) {

                        const title =
                            String(
                                game.title || ""
                            ).toLowerCase();


                        const platform =
                            String(
                                game.platform || ""
                            ).toLowerCase();
                      
                        const genre =
                            String(
                                game.genre || ""
                            ).toLowerCase();
                        return (
                            title.includes(
                                keyword
                            )
                            ||
                            platform.includes(
                                keyword
                            )
                            ||
                            genre.includes(
                                keyword
                            )
                        );

                    }
                );


            renderGames(
                filtered
            );

        }
    );

}


/* =========================================
   MULAI
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        console.log(

"================================="
        );

        console.log(
            "PLAYVAULT ADMIN JS AKTIF"
        );

        console.log(
            "================================="
        );


        loadGames();

    }
);

</script>

    }

}


/* =========================================
   RENDER
========================================= */

function renderGames(games) {

    if (!gameTable) return;


    if (!games || games.length === 0) {

        gameTable.innerHTML = `
            <tr>
                <td
                    colspan="8"
                    class="loading"
                >
                    Tidak ada game.
                </td>
            </tr>
        `;

        return;
        gameTable.innerHTML =
        games.map(
            function(game) {

                const image =
                    game.image ||
                    "https://placehold.co/55x65?text=Game";


                const status =
                    game.popular
                        ? `
                            <span class="badge badge-green">
                                Populer
                            </span>
                        `
                        : `
                            <span class="badge badge-gray">
                                Normal
                            </span>
                        `;


                return `
                    <tr>

                        <td>

                            <img
                                src="${escapeHtml(image)}"
                                class="game-image"
                                alt="Cover
                                onerror="
                                    this.src='https://placehold.co/55x65?text=Game'
                                "
                            >

                        </td>


                        <td>

                            <strong>
                                ${escapeHtml(
                                    game.title || "-"
                                )}
                            </strong>

                        </td>


                        <td>
                            ${escapeHtml(
                                game.platform || "-"
                            )}
                        </td>


                        <td>
                            ${escapeHtml(
                                game.genre || "-"
                                </td>
                                )}
                        </td>


                        <td>
                            ${game.year ?? "-"}


                        <td>
                            ${game.rating ?? "-"}
                        </td>


                        <td>
                            ${status}
                        </td>


                        <td>

                            <div
                                class="action-buttons"
                            >

                                <button
                                    type="button"
                                    class="edit-btn"
                                    disabled
                                >
                                    Edit
                                </button>


                                <button
                                    type="button"
                                    class="delete-btn"
                                    disabled
                                >
                                    Hapus
                            </button>

                            </div>

                        </td>

                    </tr>

                `;

            }
        ).join("");

}


/* =========================================
   SEARCH
========================================= */

if (searchInput) {

    searchInput.addEventListener(
        "input",
        function() {

            const keyword =
                this.value
                    .trim()
                    .toLowerCase();
            if (!keyword) {

                renderGames(
                    allGames
                );

                return;

            }


            const filtered =
                allGames.filter(
                    function(game) {

                        const title =
                            String(
                                game.title || ""
                            ).toLowerCase();


                        const platform =
                            String(
                                game.platform || ""
                            ).toLowerCase();


                        const genre =
                            String(
                                game.genre || ""
                            ).toLowerCase();
                        return (
                title.includes(keyword) ||
                platform.includes(keyword) ||
                genre.includes(keyword)
            );

        });


    renderGames(filtered);

});

logoutBtn.addEventListener(
    "click",
    async function () {

        const confirmed =
            confirm(
                "Yakin ingin keluar dari Admin?"
            );


        if (!confirmed) {

            return;

        }


        logoutBtn.disabled = true;
    logoutBtn.textContent =
            "Keluar...";


        try {

            const {
                error
            } =
                await supabaseClient.auth.signOut();


            if (error) {

                console.error(
                    "Logout error:",
                    error
                );


                showMessage(
                    "Gagal keluar: " +
                    error.message,
                    "error"
                );


                logoutBtn.disabled =
                    false;

                logoutBtn.textContent =
                    "Keluar";

                return;
                }


            window.location.href =
                "admin-login.html";
                } catch (error) {

            console.error(
                "Logout exception:",
                error
            );


            showMessage(
                "Terjadi kesalahan saat logout.",
                "error"
            );


            logoutBtn.disabled =
                false;

            logoutBtn.textContent =
                "Keluar";

        }

    }
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
    }
