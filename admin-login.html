<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PlayVault Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #0b0f14;
            color: white;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 20px;
            background: #151b23;
            border: 1px solid #29313d;
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
        }

        .subtitle {
            margin-bottom: 25px;
            text-align: center;
            color: #9ca3af;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 9px;
            border: 1px solid #374151;
            background: #0f141b;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #16a34a;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            background: #16a34a;
            color: white;
            font-weight: bold;
            font-size: 15px;
        }

        #message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .error {
            display: block !important;
            background: #3b1515;
            color: #ffb4b4;
        }

        .success {
            display: block !important;
            background: #12351f;
            color: #a7f3c0;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #9ca3af;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>PlayVault Admin</h1>

    <p class="subtitle">
        Login untuk mengelola katalog game
    </p>


    <form id="loginForm">

        <label for="email">
            Email Admin
        </label>

        <input
            type="email"
            id="email"
            placeholder="Email admin"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >


        <button
            type="submit"
            id="loginButton"
        >
            Masuk ke Dashboard
        </button>


        <div id="message"></div>

    </form>


    <a
        href="./index.html"
        class="back"
    >
        ← Kembali ke PlayVault
    </a>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://jxoeuxcwsaqmgsxiopqj.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_1FUkGM29tdLwvbnMn6AgIw_eesBsUrw";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


console.log(
    "PLAYVAULT LOGIN JS AKTIF"
);


const loginForm =
    document.getElementById("loginForm");


const loginButton =
    document.getElementById("loginButton");


const message =
    document.getElementById("message");


function showMessage(text, type) {

    message.textContent = text;

    message.className = type;

}


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        loginButton.disabled = true;

        loginButton.textContent =
            "Memproses...";


        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth
                    .signInWithPassword({
                        email: email,
                        password: password
                    });


            if (error) {

                console.error(
                    "LOGIN ERROR:",
                    error
                );

                showMessage(
                    "Login gagal: " +
                    error.message,
                    "error"
                );

                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Masuk ke Dashboard";

                return;
            }


            console.log(
                "LOGIN BERHASIL",
                data
            );


            showMessage(
                "Login berhasil. Membuka dashboard...",
                "success"
            );


            setTimeout(function() {

                window.location.href =
                    "./admin.html";

            }, 800);


        } catch (error) {

            console.error(
                "LOGIN EXCEPTION:",
                error
            );

            showMessage(
                "Terjadi kesalahan: " +
                error.message,
                "error"
            );

            loginButton.disabled =
                false;

            loginButton.textContent =
                "Masuk ke Dashboard";

        }

    }
);

</script>

</body>

</html>
